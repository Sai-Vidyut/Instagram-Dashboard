# ==============================================================================
# GitHub Actions Workflow: Generate Contribution Grid Snake Animation
# ==============================================================================
# LOCATION: Place this file in `.github/workflows/snake.yml` in your profile repository.
# PERMISSIONS REQUIRED: Go to Repo Settings -> Actions -> General -> Workflow permissions -> Select "Read and write permissions".
# ==============================================================================

name: Generate Contribution Snake Animation

on:
  # Run automatically every 24 hours at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual execution from the Actions tab
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Generates a snake game SVG animation from a github user contributions graph
      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFFFFF&color_dots=%23161B22,%230e4429,%23006d32,%2326a641,%2339d353

      # Deploy the generated SVG files to the 'output' branch
      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
