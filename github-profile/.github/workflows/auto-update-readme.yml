# ==============================================================================
# GitHub Actions Workflow: Auto-Update Profile Readme Activity & Timestamp
# ==============================================================================
# LOCATION: Place this file in `.github/workflows/auto-update-readme.yml`
# ==============================================================================

name: Dynamic Profile Auto-Update

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update Timestamp & Activity Logs
        run: |
          python -c "
          import datetime
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          print(f'Profile last synced at: {now}')
          "

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore: automated profile metrics sync"
          git push
